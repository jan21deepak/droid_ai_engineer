[pytest]
asyncio_mode = auto
testpaths = tests
# Explicit naming convention: integration tests live in tests/integration/,
# unit tests in tests/ — both use the test_*.py / Test* prefix pattern.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Track suite duration on every run (surfaced in CI output too).
addopts = --durations=10
