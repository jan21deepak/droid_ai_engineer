services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/tasks.db
      WORKSPACE_ROOT: /data/workspace
    volumes:
      - droid_data:/data
      - droid_home:/home/appuser/.factory
    restart: unless-stopped

volumes:
  droid_data:
  droid_home:
