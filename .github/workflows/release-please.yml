# Automated release notes: release-please maintains a changelog and version
# bump PRs from conventional commits, and creates GitHub releases on merge.
name: Release please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
